name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  archive:
    name: Archive & Notarize
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Archive
        run: |
          xcodebuild archive \
            -project ARM64Learn.xcodeproj \
            -scheme ARM64Learn \
            -destination "platform=macOS" \
            -archivePath build/ARM64Learn.xcarchive

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ARM64Learn.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist scripts/ExportOptions.plist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARM64Learn-${{ github.ref_name }}
          path: build/export/ARM64Learn.app
