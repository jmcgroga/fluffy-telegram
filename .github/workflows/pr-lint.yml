name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  lint-title:
    name: Lint PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
          requireScope: false
          subjectPattern: ^.{1,72}$
          subjectPatternError: |
            The PR title must be 72 characters or fewer.
